[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "dw1-coop-workbench"
version = "0.1.0"
description = "A provenance-first Digimon World 1 disc analysis workbench"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
# Essentials supplies widgets; Addons supplies QtMultimedia for player audio.
dependencies = ["PySide6-Essentials>=6.8,<7", "PySide6-Addons>=6.8,<7", "Pillow>=11,<13", "numpy>=2,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.gui-scripts]
dw1-settings = "dw1_workbench.app:main"
dw1-play = "dw1_workbench.play_app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
